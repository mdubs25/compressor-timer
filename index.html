<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vallen Compressor Verification Timer</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    background-color: white;
    transition: background-color 0.5s ease;
  }

  h1 { font-size:36px; margin-top:20px; margin-bottom:10px; }
  #clock { font-size:80px; margin-top:10px; }
  #date { font-size:28px; margin-bottom:20px; }

  #controlsRow { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; align-items:flex-end; margin-bottom:10px; }
  #controlsRow div { display:flex; flex-direction:column; align-items:center; }
  input, select, button { padding:10px; margin:5px; font-size:16px; }
  #ackBtn { display:none; padding:12px 25px; font-size:18px; margin-bottom:20px; }
  #timerListContainer { display:none; margin-top:20px; }
  #timerList { display:grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap:10px; list-style:none; padding:0; }
  #timerList li button { margin-left:5px; }
  footer { text-align:center; font-size:12px; margin-top:40px; color:#555; }
</style>
</head>
<body>

<h1>Vallen Compressor Verification Timer</h1>
<div id="clock"></div>
<div id="date"></div>

<div id="controlsRow">
  <div>
    <label for="numTimers">Timers</label>
    <input type="number" id="numTimers" placeholder="Number" min="1" style="width:80px;">
  </div>
  <div>
    <label for="interval">Interval (min)</label>
    <input type="number" id="interval" placeholder="Minutes" min="1" style="width:80px;">
  </div>
  <div>
    <label for="startTime">Start Time</label>
    <input type="datetime-local" id="startTime" style="width:180px;">
  </div>
  <div>
    <label for="soundSelect">Sound</label>
    <select id="soundSelect" style="width:120px;">
      <option value="beep">Beep</option>
      <option value="alarm">Alarm</option>
      <option value="bell">Bell</option>
      <option value="chime">Chime</option>
      <option value="digital">Digital Alarm</option>
    </select>
  </div>
  <button onclick="startTimers()" style="height:40px;">Start</button>
  <button onclick="resetTimers()" style="height:40px;">Reset</button>
</div>

<!-- Acknowledge button below inputs -->
<button id="ackBtn" onclick="acknowledge()">Acknowledge</button>

<!-- Active Timers list -->
<div id="timerListContainer">
  <h3 id="timerListTitle">Active Timers</h3>
  <ul id="timerList"></ul>
</div>

<audio id="beepSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
<audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>
<audio id="bellSound" src="https://actions.google.com/sounds/v1/alarms/bell_ring.ogg"></audio>
<audio id="chimeSound" src="https://actions.google.com/sounds/v1/alarms/medium_chime.ogg"></audio>
<audio id="digitalSound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm.ogg"></audio>

<script>
let timers = [];
let currentIndex = 0;
let activeTimer = null;
let selectedSound = null;
let warningShown = false;

function updateClock() {
  const now = new Date();
  let hours = now.getHours();
  const minutes = now.getMinutes().toString().padStart(2,'0');
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  hours = hours ? hours : 12;
  document.getElementById("clock").innerText = `${hours}:${minutes} ${ampm}`;
  document.getElementById("date").innerText = now.toDateString();
}
setInterval(updateClock, 1000);
updateClock();

function startTimers() {
  const num = parseInt(document.getElementById("numTimers").value);
  const interval = parseInt(document.getElementById("interval").value);
  const startInput = document.getElementById("startTime").value;
  selectedSound = document.getElementById("soundSelect").value;

  if (!num || !interval || !startInput) {
    alert("Please fill all fields.");
    return;
  }

  timers = [];
  currentIndex = 0;
  warningShown = false;

  let start = new Date(startInput);

  for (let i = 0; i < num; i++) {
    timers.push(new Date(start.getTime() + i * interval * 60000));
  }

  document.getElementById("status").innerText = "Timers started.";
  updateTimerList();
  runTimer();
}

function runTimer() {
  if (currentIndex >= timers.length) {
    document.getElementById("status").innerText = "All timers completed.";
    document.body.style.backgroundColor = "white";
    return;
  }

  activeTimer = setInterval(() => {
    const now = new Date();
    const target = timers[currentIndex];
    const diff = target - now;

    if (diff <= 120000 && diff > 0 && !warningShown) {
      document.body.style.backgroundColor = "yellow";
      warningShown = true;
    }

    if (diff <= 0) {
      clearInterval(activeTimer);
      document.body.style.backgroundColor = "red";
      document.getElementById("status").innerText = 
        "CHECK THE COMPRESSOR AND LOG THE OBSERVED READINGS!";
      playSound();
      document.getElementById("ackBtn").style.display = "inline-block";
    }

  }, 500);
}

function playSound() {
  let soundId = selectedSound + "Sound";
  let sound = document.getElementById(soundId);
  sound.loop = true;
  sound.play();
}

function acknowledge() {
  let sound = document.getElementById(selectedSound + "Sound");
  sound.pause();
  sound.currentTime = 0;

  document.getElementById("ackBtn").style.display = "none";
  document.body.style.backgroundColor = "white";
  document.getElementById("status").innerText = "Timer acknowledged.";

  currentIndex++;
  warningShown = false;
  updateTimerList();
  runTimer();
}

function updateTimerList() {
  const container = document.getElementById("timerListContainer");
  const list = document.getElementById("timerList");
  const title = document.getElementById("timerListTitle");
  list.innerHTML = "";

  let activeTimersExist = false;

  timers.forEach((timer, idx) => {
    if (idx < currentIndex) return; // Skip past timers
    activeTimersExist = true;

    const li = document.createElement("li");
    const hours = timer.getHours() % 12 || 12;
    const minutes = timer.getMinutes().toString().padStart(2, "0");
    const ampm = timer.getHours() >= 12 ? "PM" : "AM";
    li.textContent = `${hours}:${minutes} ${ampm}`;

    const delBtn = document.createElement("button");
    delBtn.textContent = "Delete";
    delBtn.onclick = () => {
      timers.splice(idx, 1);
      updateTimerList();
      if (idx === currentIndex) {
        clearInterval(activeTimer);
        runTimer();
      }
    };

    li.appendChild(delBtn);
    list.appendChild(li);
  });

  container.style.display = activeTimersExist ? "block" : "none";
  title.style.display = activeTimersExist ? "block" : "none";
}

function resetTimers() {
  if (activeTimer) clearInterval(activeTimer);

  timers = [];
  currentIndex = 0;
  warningShown = false;

  document.getElementById("numTimers").value = "";
  document.getElementById("interval").value = "";
  document.getElementById("startTime").value = "";
  document.getElementById("soundSelect").value = "beep";

  document.getElementById("status").innerText = "";
  document.getElementById("ackBtn").style.display = "none";
  document.body.style.backgroundColor = "white";
  updateTimerList();
}
</script>

<footer>Created by MW</footer>

</body>
</html>
